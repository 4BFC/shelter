name: Release Shelter Lite

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      release-tag: ${{ github.event.release.tag_name }}

  publish:
    name: Attach verified macOS and Windows installers
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download both verified platform builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shelter-lite-*
          merge-multiple: true
          path: dist

      - name: Attach installers and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/shelter-lite-macos.zip \
            dist/shelter-lite-macos.zip.sha256 \
            dist/shelter-lite-macos.sh \
            dist/shelter-lite-macos.sh.sha256 \
            dist/shelter-lite-windows.zip \
            dist/shelter-lite-windows.zip.sha256 \
            dist/shelter-lite-windows.ps1 \
            dist/shelter-lite-windows.ps1.sha256 \
            dist/VERSION \
            --repo "$GH_REPO" \
            --clobber
